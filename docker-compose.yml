services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bharat_ai
      POSTGRES_USER: bharat
      POSTGRES_PASSWORD: bharat_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bharat:bharat_dev@db:5432/bharat_ai
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
